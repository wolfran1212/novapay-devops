name: NovaPay CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Static Analysis
        run: npm run lint

      - name: Security Audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Run Tests
        run: npm test
